<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Bar chart</title>
<style>
:root { --bg: #0F172A; --color: #F59E0B; --accent: #38BDF8; --ink: #F8FAFC; --muted: #94A3B8; --font: 'Inter', 'PingFang SC', 'Noto Sans SC', sans-serif; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); font-family: var(--font); }
#frame { position: fixed; inset: 0; display: flex; flex-direction: column; }
.title { color: var(--ink); font-size: 4.2vw; font-weight: 800; margin: 6vh 0 2vh 8vw; }
.sub { color: var(--muted); font-size: 2.1vw; font-weight: 500; margin: -1vh 0 0 8.2vw; }
#chart { flex: 1; width: 100%; }
svg { width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="frame">
  <div class="title" id="title">Monthly active users</div>
  <div class="sub" id="sub">in thousands</div>
  <div id="chart"><svg id="c"></svg></div>
</div>
<script type="module">
/* Animated bar chart. Colors come from the clip's CSS vars (--color, --accent, --ink, --muted).
   The series lives in `data` (edit it, or load a data.json in `ready`). The picture is a function of t alone. */
const data = [
  { label: 'Jan', value: 42 }, { label: 'Feb', value: 55 }, { label: 'Mar', value: 48 },
  { label: 'Apr', value: 71 }, { label: 'May', value: 63 }, { label: 'Jun', value: 88 },
];
const box = document.getElementById('chart'), svg = document.getElementById('c');
const css = getComputedStyle(document.documentElement);
const color = () => css.getPropertyValue('--color').trim() || '#F59E0B';
const accent = () => css.getPropertyValue('--accent').trim() || '#38BDF8';
const easeOut = (t) => 1 - Math.pow(1 - t, 3);
const in_ = (t) => easeOut(Math.max(0, Math.min(1, t / 1.1)));
function draw(t) {
  const W = box.clientWidth, H = box.clientHeight;
  if (W === 0 || H === 0) return;
  const pad = 0.14 * H, gap = 0.06 * W, max = Math.max(...data.map((d) => d.value)), n = data.length;
  const bw = (W - gap * (n - 1)) / n;
  svg.innerHTML = data.map((d, i) => {
    const grow = in_(t - i * 0.12), bh = (d.value / max) * (H - pad - 6 * H * 0.06) * grow;
    const x = i * (bw + gap), y = H - pad - bh, grad = i === n - 1;
    return `<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(0, bh)}" rx="${bw * 0.12}" fill="${grad ? accent() : color()}"/>`
      + `<text x="${x + bw / 2}" y="${H - pad + H * 0.06}" fill="${css.getPropertyValue('--muted').trim()||'#94A3B8'}" font-size="${H * 0.05}" text-anchor="middle">${d.label}</text>`
      + `<text x="${x + bw / 2}" y="${y - H * 0.02}" fill="${css.getPropertyValue('--ink').trim()||'#F8FAFC'}" font-size="${H * 0.05}" font-weight="700" text-anchor="middle" opacity="${grow > 0.5 ? 1 : 0}">${d.value}</text>`;
  }).join('');
  const a = easeOut(Math.min(1, t / 0.8));
  const title = document.getElementById('title'), sub = document.getElementById('sub');
  if (title) { title.style.opacity = a; title.style.translate = `0 ${((1 - a) * 3).toFixed(1)}vh`; }
  if (sub) sub.style.opacity = a;
}
window.film = { frame: draw, duration: 4 };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(t % window.film.duration); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
